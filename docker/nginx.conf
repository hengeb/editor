map $status $log_server_errors_only {
    ~^5 1;
    default 0;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout main if=$log_server_errors_only;
    error_log /dev/stderr warn;

    root /var/www/html/public;
    index index.html;

    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    # SAMEORIGIN statt DENY: Firefox' PDF-Viewer bettet /api/raw beim
    # <embed type="application/pdf"> intern selbst wieder ein (gleiche
    # Origin) - DENY blockiert das mit. Fremde Seiten bleiben weiterhin
    # ausgesperrt.
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
