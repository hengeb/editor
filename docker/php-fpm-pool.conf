[www]
; Das offizielle php-fpm-Alpine-Image aktiviert standardmäßig ein eigenes
; Access-Log für jeden Request (docker.conf). Das nginx-Access-Log ist bereits
; auf 5xx beschränkt (siehe docker/nginx.conf) - dieses zweite, ungefilterte
; Log wird deaktiviert, damit Container-Logs wirklich nur bei Serverfehlern
; etwas ausgeben. Echte PHP-Fehler landen weiterhin über error_log (stderr).
access.log = /dev/null
catch_workers_output = no
